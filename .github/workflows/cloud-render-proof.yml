name: Cloud Render Proof

on:
  push:
    branches:
      - cloud-render-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-render-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and verify a 1080p MP4 on GitHub-hosted CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg

      - name: Generate a synthetic source clip
        run: |
          mkdir -p proof-output
          ffmpeg -hide_banner -y \
            -f lavfi -i "testsrc2=size=1920x1080:rate=24:duration=5" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=5" \
            -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 128k proof-output/source.mp4

      - name: Perform an editing/export pass
        run: |
          ffmpeg -hide_banner -y -i proof-output/source.mp4 \
            -vf "scale=1920:1080,format=yuv420p" \
            -af "volume=0.8" -t 4 \
            -c:v libx264 -preset veryfast -crf 23 \
            -c:a aac -b:a 128k -movflags +faststart \
            proof-output/openmontage-cloud-proof.mp4

      - name: Verify the rendered MP4
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 proof-output/openmontage-cloud-proof.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 proof-output/openmontage-cloud-proof.mp4
          python - <<'PY'
          import json
          import subprocess

          path = "proof-output/openmontage-cloud-proof.mp4"
          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", path
          ], text=True)
          data = json.loads(raw)
          video = next(s for s in data["streams"] if s["codec_type"] == "video")
          assert video["width"] == 1920, video
          assert video["height"] == 1080, video
          assert float(data["format"]["duration"]) >= 3.5, data["format"]
          print("PASS: valid 1080p MP4 rendered on GitHub-hosted CPU.")
          PY

      - name: Run repository FFmpeg smoke test
        run: python scripts/smoke_ffmpeg_editing.py

      - name: Exercise the OpenMontage VideoCompose tool with synthetic media
        run: |
          python tests/qa/test_05_video_compose.py
          for file in compose_basic.mp4 compose_subtitled.mp4 compose_burn_subs.mp4 compose_encoded.mp4 compose_overlay.mp4; do
            test -s "tests/qa/output/$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "tests/qa/output/$file"
          done

      - name: Set up Node.js for Remotion
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install Remotion dependencies
        working-directory: remotion-composer
        run: npm ci --no-audit --no-fund

      - name: Render a visible OpenMontage HeroTitle composition through Remotion
        working-directory: remotion-composer
        run: |
          mkdir -p ../proof-output
          npx remotion render src/index.tsx HeroTitle ../proof-output/openmontage-remotion-cloud-proof.mp4 --frames=0-89 --gl=swangle --concurrency=2

      - name: Verify Remotion output
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 proof-output/openmontage-remotion-cloud-proof.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 proof-output/openmontage-remotion-cloud-proof.mp4
          python - <<'PY'
          import json
          import subprocess

          path = "proof-output/openmontage-remotion-cloud-proof.mp4"
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", path
          ], text=True))
          video = next(s for s in data["streams"] if s["codec_type"] == "video")
          assert video["width"] == 1920, video
          assert video["height"] == 1080, video
          assert float(data["format"]["duration"]) >= 2.9, data["format"]
          stats = subprocess.check_output([
              "ffmpeg", "-v", "info", "-ss", "2", "-i", path,
              "-vf", "signalstats,metadata=print", "-frames:v", "1",
              "-f", "null", "-"
          ], text=True, stderr=subprocess.STDOUT)
          ymin = int(next(line.rsplit("=", 1)[1] for line in stats.splitlines() if "lavfi.signalstats.YMIN=" in line))
          ymax = int(next(line.rsplit("=", 1)[1] for line in stats.splitlines() if "lavfi.signalstats.YMAX=" in line))
          assert ymax - ymin > 60, (ymin, ymax)
          print(f"PASS: visible OpenMontage HeroTitle rendered to 1080p MP4 (luma range {ymin}-{ymax}).")
          PY

      - name: Set up Python for HyperFrames
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install OpenMontage Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run the real OpenMontage HyperFrames end-to-end render
        env:
          HYPERFRAMES_QA: "1"
          HYPERFRAMES_QA_RENDER: "1"
          HYPERFRAMES_QA_OUTPUT: ${{ github.workspace }}/proof-output/openmontage-hyperframes-cloud-proof.mp4
        run: python -m pytest tests/qa/test_09_hyperframes_compose.py -q

      - name: Verify HyperFrames output
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 proof-output/openmontage-hyperframes-cloud-proof.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 proof-output/openmontage-hyperframes-cloud-proof.mp4
          test -s proof-output/openmontage-hyperframes-cloud-proof.mp4

      - name: Upload HyperFrames proof video
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-hyperframes-cloud-proof
          path: proof-output/openmontage-hyperframes-cloud-proof.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Upload Remotion proof video
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-remotion-cloud-proof
          path: proof-output/openmontage-remotion-cloud-proof.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Upload proof video
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-cloud-render-proof
          path: proof-output/openmontage-cloud-proof.mp4
          if-no-files-found: error
          retention-days: 1
